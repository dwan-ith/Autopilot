[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-runtime"
version = "0.2.0"
description = "Autonomous operator runtime for policy-gated operational missions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.124.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "mcp>=1.25,<2",
    "cryptography>=46,<47",
]

[project.scripts]
autopilot-mcp = "autopilot.mcp_server:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
omium = [
    "omium>=0.4.1,<0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ignore rules that are unfixable in the existing codebase:
# BLE001 = broad exception (existing patterns), E722 = bare except, S110 = pass in except,
# S105 = hardcoded password, E501 = line too long
ignore = ["BLE001", "E722", "S110", "S105", "E501", "I001", "F401"]
select = ["E", "F", "W", "I", "B", "S", "BLE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = false
