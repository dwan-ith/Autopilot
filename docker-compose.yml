services:
  backend:
    build: .
    ports:
      - "8090:8090"
    env_file: .env
    environment:
      # Must bind 0.0.0.0 inside the container for the port mapping to work;
      # env_check warns loudly unless AUTOPILOT_API_KEY is also set.
      AUTOPILOT_HOST: 0.0.0.0
    volumes:
      - autopilot-data:/app/data
      - autopilot-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Startup includes DB migration and MCP transport bring-up; give it room
      start_period: 20s

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - AUTOPILOT_API_ORIGIN=http://backend:8090
    depends_on:
      backend:
        condition: service_healthy

volumes:
  autopilot-data:
  autopilot-artifacts:
