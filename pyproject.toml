[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-runtime"
version = "0.2.0"
description = "Autonomous operator runtime for policy-gated operational missions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.124.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
omium = [
    "omium>=0.4.1,<0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
