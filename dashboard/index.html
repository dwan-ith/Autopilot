<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AUTOPILOT - Autonomous Operator Runtime</title>
    <meta name="description" content="Autonomous Operator Runtime for connected-system events and bounded actions." />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Autonomous Operator Runtime</p>
          <h1>AUTOPILOT</h1>
        </div>
        <div class="runtime-meta">
          <span class="provider-badge" id="providerBadge">heuristic</span>
          <span class="status-dot" id="statusDot"></span>
          <span class="muted" id="statusLabel">idle</span>
        </div>
        <div class="actions">
          <button id="demoBtn" class="primary">Run Demo</button>
          <button id="refreshBtn" class="secondary">Refresh</button>
        </div>
      </header>

      <section class="grid">
        <aside class="panel">
          <div class="panel-head">
            <h2>Missions</h2>
            <span class="count" id="missionCount">0</span>
          </div>
          <div id="missions" class="mission-list"></div>
        </aside>

        <section class="panel detail">
          <div class="panel-head">
            <h2>Mission Execution</h2>
            <span class="status-pill" id="selectedStatus">idle</span>
          </div>
          <div id="missionDetail" class="detail-body">
            <div class="empty-state">
              Run the demo or send a webhook to watch AUTOPILOT build a mission graph.
            </div>
          </div>
        </section>

        <aside class="panel">
          <div class="panel-head">
            <h2>Connectors</h2>
          </div>
          <div id="connectors" class="connector-list"></div>
          <div class="panel-head split">
            <h2>Trace</h2>
            <span class="count" id="traceCount">0</span>
          </div>
          <div id="traceList" class="trace-list"></div>
        </aside>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
