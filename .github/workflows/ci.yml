name: Autopilot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      AUTOPILOT_RUN_INTEGRATION: "0"
      AUTOPILOT_DISABLE_LLM: "1"
      AUTOPILOT_CREDENTIAL_ENCRYPTION_KEY: "ci-test-placeholder-key-not-for-prod"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Lint with ruff (non-blocking)
      run: python -m ruff check src/ tests/ || true

    - name: Run unit tests
      run: python -m pytest tests/test_runtime.py tests/test_mcp.py -v --tb=short