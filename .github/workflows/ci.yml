name: Autopilot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      AUTOPILOT_RUN_INTEGRATION: 0
      AUTOPILOT_DISABLE_LLM: 1
      AUTOPILOT_CREDENTIAL_ENCRYPTION_KEY: "test-key-for-ci-action-only-not-for-prod"
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        
    - name: Run Linters & Static Analysis
      run: |
        source venv/bin/activate
        python -m ruff check src/ tests/
        python -m mypy src/ tests/
        
    - name: Run Backend Unit Tests
      run: |
        source venv/bin/activate
        python -m pytest tests/test_runtime.py tests/test_mcp.py -v --tb=short
